name: Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'

jobs:
  build:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    env:
      ZEROSTEP_TOKEN: ${{ secrets.ZEROSTEP_TOKEN }}
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Use Node.js 21
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Setup ZeroStep token
        run: |
          if [ -z "$ZEROSTEP_TOKEN" ]; then
            echo "::error::Secret ZEROSTEP_TOKEN vazio ou ausente. Em github.com → Settings → Secrets and variables → Actions, crie o secret com nome exato ZEROSTEP_TOKEN (valor em https://app.zerostep.com). Em PRs de fork, secrets do repositório base não são expostos."
            exit 1
          fi
          node -e "require('fs').writeFileSync('zerostep.config.json', JSON.stringify({ TOKEN: process.env.ZEROSTEP_TOKEN }))"
      - run: npm install
      - run: npx playwright install
      - run: npm run actions

  sonarcloud:
    name: Run SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
